# cloudflared 터널 설정 예시
#
# 실제 파일 위치 (Windows): C:\Users\<사용자>\.cloudflared\config.yml
# <TUNNEL_UUID> 는 `cloudflared tunnel create stockdruid` 실행 시 출력된다.
# credentials-file 은 같은 명령이 생성한 JSON 경로다. 이 파일은 비밀이므로 커밋하지 않는다.

tunnel: <TUNNEL_UUID>
credentials-file: C:\Users\<사용자>\.cloudflared\<TUNNEL_UUID>.json

ingress:
  - hostname: stockdruid.me
    service: http://localhost:3000
  - hostname: www.stockdruid.me
    service: http://localhost:3000
  # 위 규칙에 걸리지 않는 요청은 전부 거절한다. catch-all 은 필수다.
  - service: http_status:404
